name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --extra agent
      - name: ruff check
        run: uv run ruff check --output-format=github
      - name: ruff format --check
        run: uv run ruff format --check
      - name: mypy
        run: uv run mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Pin Python ${{ matrix.python }}
        run: echo "${{ matrix.python }}" > .python-version
      - run: uv sync --extra agent
      - name: pytest (offline only)
        run: uv run pytest -m "not network and not download"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Fast metadata-only GDC checks remain part of every PR gate.
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --extra agent
      - name: pytest (metadata against live GDC)
        run: uv run pytest -m network -v

  download-e2e:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Full live downloads are valuable but too slow and externally variable for PR gating.
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --extra agent
      - name: pytest (downloads against live GDC)
        run: uv run pytest -m download -v
